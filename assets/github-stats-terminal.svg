<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-label="GitHub stats de igordesouzabranco em formato de terminal">
  <title>GitHub stats - igordesouzabranco</title>
  <defs>
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#2bff2b" opacity="0.05"/>
    </pattern>
    <clipPath id="type1"><rect x="34" y="62" width="520" height="26">
      <animate attributeName="width" from="0" to="520" dur="1.5s" begin="0s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="34" y="250" width="520" height="26">
      <animate attributeName="width" from="0" to="520" dur="1.1s" begin="3.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; font-size: 15px; }
    .g  { fill: #2bff2b; }
    .w  { fill: #d6ffd6; }
    .c  { fill: #00d9ff; }
    .d  { fill: #5f8f5f; }
    .s  { font-size: 14px; }
    @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
    .a { animation: fi .4s ease-out both; }
  </style>

  <rect x="10" y="10" width="840" height="480" rx="10" fill="#050805" stroke="#2bff2b" stroke-opacity="0.55"/>
  <path d="M10 20a10 10 0 0 1 10-10h820a10 10 0 0 1 10 10v24H10z" fill="#0d160d"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="27" r="6" fill="#27c93f"/>
  <text x="430" y="32" text-anchor="middle" class="d s">igor@dev: ~/github-stats</text>
  <rect x="10" y="44" width="840" height="446" fill="url(#scan)"/>

  <g clip-path="url(#type1)" filter="url(#glow)">
    <text x="34" y="80"><tspan class="g">igor@dev</tspan><tspan class="c">:~$</tspan><tspan class="w"> gh stats --user igordesouzabranco</tspan></text>
  </g>

  <g filter="url(#glow)">
    <g class="a" style="animation-delay:1.90s">
      <text x="54" y="116" class="w">stars_earned</text>
      <line x1="200" y1="112" x2="320" y2="112" stroke="#2bff2b" stroke-opacity="0.35" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="345" y="116" text-anchor="end" class="g">17</text>
    </g>
    <g class="a" style="animation-delay:2.05s">
      <text x="54" y="142" class="w">total_commits</text>
      <line x1="200" y1="138" x2="320" y2="138" stroke="#2bff2b" stroke-opacity="0.35" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="345" y="142" text-anchor="end" class="g">354</text>
    </g>
    <g class="a" style="animation-delay:2.20s">
      <text x="54" y="168" class="w">pull_requests</text>
      <line x1="200" y1="164" x2="320" y2="164" stroke="#2bff2b" stroke-opacity="0.35" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="345" y="168" text-anchor="end" class="g">13</text>
    </g>
    <g class="a" style="animation-delay:2.35s">
      <text x="54" y="194" class="w">issues</text>
      <line x1="200" y1="190" x2="320" y2="190" stroke="#2bff2b" stroke-opacity="0.35" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="345" y="194" text-anchor="end" class="g">1</text>
    </g>
    <g class="a" style="animation-delay:2.50s">
      <text x="54" y="220" class="w">contributed_to</text>
      <line x1="200" y1="216" x2="320" y2="216" stroke="#2bff2b" stroke-opacity="0.35" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="345" y="220" text-anchor="end" class="g">0</text>
    </g>
  </g>

  <g class="a" style="animation-delay:2.6s">
    <rect x="560" y="98" width="270" height="134" rx="6" fill="none" stroke="#2bff2b" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="580" y="122" class="d s"># rank</text>
    <text x="695" y="188" text-anchor="middle" class="g" filter="url(#glow)" style="font-size:58px;font-weight:700">B-</text>
    <text x="695" y="216" text-anchor="middle" class="c s">// next: B</text>
  </g>

  <g class="a" style="animation-delay:3.2s">
    <g clip-path="url(#type2)" filter="url(#glow)">
      <text x="34" y="268"><tspan class="g">igor@dev</tspan><tspan class="c">:~$</tspan><tspan class="w"> gh langs --top 6</tspan></text>
    </g>
  </g>

  <g class="a" style="animation-delay:4.3s">
    <text x="54" y="304" class="w s">JavaScript</text>
    <rect x="170" y="293" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="293" width="318.52" height="12" rx="2" fill="#2bff2b" filter="url(#glow)"><animate attributeName="width" from="0" to="318.52" dur="1s" begin="4.3s" fill="freeze"/></rect>
    <text x="690" y="304" class="g s">63.70%</text>
  </g>
  <g class="a" style="animation-delay:4.5s">
    <text x="54" y="330" class="w s">CSS</text>
    <rect x="170" y="319" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="319" width="64.80" height="12" rx="2" fill="#1fe0a0" filter="url(#glow)"><animate attributeName="width" from="0" to="64.80" dur="1s" begin="4.5s" fill="freeze"/></rect>
    <text x="690" y="330" class="g s">12.96%</text>
  </g>
  <g class="a" style="animation-delay:4.7s">
    <text x="54" y="356" class="w s">HTML</text>
    <rect x="170" y="345" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="345" width="38.22" height="12" rx="2" fill="#00d9ff" filter="url(#glow)"><animate attributeName="width" from="0" to="38.22" dur="1s" begin="4.7s" fill="freeze"/></rect>
    <text x="690" y="356" class="g s">7.64%</text>
  </g>
  <g class="a" style="animation-delay:4.9s">
    <text x="54" y="382" class="w s">Python</text>
    <rect x="170" y="371" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="371" width="38.21" height="12" rx="2" fill="#3aa0ff" filter="url(#glow)"><animate attributeName="width" from="0" to="38.21" dur="1s" begin="4.9s" fill="freeze"/></rect>
    <text x="690" y="382" class="g s">7.64%</text>
  </g>
  <g class="a" style="animation-delay:5.1s">
    <text x="54" y="408" class="w s">PHP</text>
    <rect x="170" y="397" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="397" width="22.38" height="12" rx="2" fill="#7a7cff" filter="url(#glow)"><animate attributeName="width" from="0" to="22.38" dur="1s" begin="5.1s" fill="freeze"/></rect>
    <text x="690" y="408" class="g s">4.48%</text>
  </g>
  <g class="a" style="animation-delay:5.3s">
    <text x="54" y="434" class="w s">EJS</text>
    <rect x="170" y="423" width="500" height="12" rx="2" fill="#0f2a0f"/>
    <rect x="170" y="423" width="8.84" height="12" rx="2" fill="#b36bff" filter="url(#glow)"><animate attributeName="width" from="0" to="8.84" dur="1s" begin="5.3s" fill="freeze"/></rect>
    <text x="690" y="434" class="g s">1.77%</text>
  </g>

  <g class="a" style="animation-delay:5.8s" filter="url(#glow)">
    <text x="34" y="466"><tspan class="g">igor@dev</tspan><tspan class="c">:~$</tspan></text>
    <rect x="142" y="452" width="9" height="16" fill="#2bff2b">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="170" y="466" class="d s"># atualizado em 22/11/2026</text>
  </g>
</svg>
