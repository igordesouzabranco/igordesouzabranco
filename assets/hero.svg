<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="igor@dev neofetch: dev em início de carreira, Python e JavaScript, jovem aprendiz na Appmax, aberto a oportunidades">
  <title>igor@dev</title>
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8f4f"/>
      <stop offset="1" stop-color="#2bff2b"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#2bff2b" opacity="0.05"/>
    </pattern>
    <clipPath id="type1"><rect x="34" y="56" width="300" height="26">
      <animate attributeName="width" from="0" to="300" dur="1s" begin="0s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; font-size: 15px; }
    .g { fill: #2bff2b; }
    .w { fill: #d6ffd6; }
    .c { fill: #00d9ff; }
    .d { fill: #5f8f5f; }
    .s { font-size: 14px; }
    .b { font-weight: 700; }
    @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
    .a { animation: fi .4s ease-out both; }
    @keyframes slither { to { stroke-dashoffset: -64; } }
    .scales { stroke-dasharray: 2 14; animation: slither 3s linear infinite; }
    @keyframes flick { 0%, 70%, 100% { opacity: 0; } 78%, 92% { opacity: 1; } }
    .tongue { animation: flick 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .live { animation: pulse 1.6s ease-in-out infinite; }
  </style>

  <!-- janela -->
  <rect x="10" y="10" width="840" height="320" rx="10" fill="#050805" stroke="#2bff2b" stroke-opacity="0.55"/>
  <path d="M10 20a10 10 0 0 1 10-10h820a10 10 0 0 1 10 10v24H10z" fill="#0d160d"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="27" r="6" fill="#27c93f"/>
  <text x="430" y="32" text-anchor="middle" class="d s">igor@dev: ~</text>
  <rect x="10" y="44" width="840" height="286" fill="url(#scan)"/>

  <!-- prompt -->
  <g clip-path="url(#type1)" filter="url(#glow)">
    <text x="34" y="74"><tspan class="g">igor@dev</tspan><tspan class="c">:~$</tspan><tspan class="w"> neofetch</tspan></text>
  </g>

  <!-- cobra -->
  <g class="a" style="animation-delay:.9s" filter="url(#softglow)">
    <path d="M60 300 C60 255 150 265 165 235 S95 190 150 165 S245 175 245 135" fill="none" stroke="url(#body)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="scales" d="M60 300 C60 255 150 265 165 235 S95 190 150 165 S245 175 245 135" fill="none" stroke="#050805" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <!-- cabeça -->
    <ellipse cx="245" cy="122" rx="15" ry="19" fill="url(#body)"/>
    <circle cx="238" cy="117" r="3.6" fill="#050805"/>
    <circle cx="252" cy="117" r="3.6" fill="#050805"/>
    <circle cx="238" cy="116.2" r="1.2" fill="#d6ffd6"/>
    <circle cx="252" cy="116.2" r="1.2" fill="#d6ffd6"/>
    <!-- língua -->
    <path class="tongue" d="M245 103 L245 90 M245 90 L240 83 M245 90 L250 83" fill="none" stroke="#ff4d6d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- neofetch -->
  <g class="a" style="animation-delay:1.1s" filter="url(#glow)">
    <text x="330" y="116" class="g b">igor@dev</text>
    <line x1="330" y1="126" x2="470" y2="126" stroke="#2bff2b" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#glow)">
    <g class="a" style="animation-delay:1.4s"><text x="330" y="152" class="g">role</text><text x="420" y="152" class="w">dev em início de carreira</text></g>
    <g class="a" style="animation-delay:1.6s"><text x="330" y="178" class="g">focus</text><text x="420" y="178" class="w">Python &amp; JavaScript</text></g>
    <g class="a" style="animation-delay:1.8s"><text x="330" y="204" class="g">work</text><text x="420" y="204" class="w">jovem aprendiz @ Appmax</text></g>
    <g class="a" style="animation-delay:2.0s"><text x="330" y="230" class="g">study</text><text x="420" y="230" class="w">Téc. Desenvolvimento de Sistemas · SENAC</text></g>
    <g class="a" style="animation-delay:2.2s"><text x="330" y="256" class="g">base</text><text x="420" y="256" class="w">Brasil · GMT-3</text></g>
    <g class="a" style="animation-delay:2.4s">
      <text x="330" y="282" class="g">status</text>
      <text x="420" y="282" class="g live">●</text>
      <text x="440" y="282" class="w">aberto a oportunidades</text>
    </g>
  </g>

  <!-- paleta -->
  <g class="a" style="animation-delay:2.7s">
    <rect x="330" y="298" width="24" height="12" rx="2" fill="#2bff2b"/>
    <rect x="358" y="298" width="24" height="12" rx="2" fill="#1fe0a0"/>
    <rect x="386" y="298" width="24" height="12" rx="2" fill="#00d9ff"/>
    <rect x="414" y="298" width="24" height="12" rx="2" fill="#3aa0ff"/>
    <rect x="442" y="298" width="24" height="12" rx="2" fill="#7a7cff"/>
    <rect x="470" y="298" width="24" height="12" rx="2" fill="#b36bff"/>
    <rect x="498" y="298" width="24" height="12" rx="2" fill="#d6ffd6"/>
    <rect x="526" y="298" width="24" height="12" rx="2" fill="#5f8f5f"/>
  </g>
</svg>
