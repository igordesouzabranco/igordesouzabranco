    <text class="asc" x="48.32" y="299.94" xml:space="preserve" textLength="250.80" lengthAdjust="spacing" style="animation-delay:1.70s">              +               :.:=+=============---::::</text>
    <text class="asc" x="48.32" y="309.06" xml:space="preserve" textLength="250.80" lengthAdjust="spacing" style="animation-delay:1.75s">                               :.:+============---:.:.=</text>
    <text class="asc" x="48.32" y="318.18" xml:space="preserve" textLength="246.24" lengthAdjust="spacing" style="animation-delay:1.80s">                                .:=============--:..:.</text>
  </g>

  <!-- neofetch -->
  <g class="a" style="animation-delay:1.1s" filter="url(#glow)">
    <text x="330" y="116" class="g b">igor@dev</text>
    <line x1="330" y1="126" x2="470" y2="126" stroke="#2bff2b" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#glow)">
    <g class="a" style="animation-delay:1.4s"><text x="330" y="152" class="g">role</text><text x="420" y="152" class="w">dev em início de carreira</text></g>
    <g class="a" style="animation-delay:1.6s"><text x="330" y="178" class="g">focus</text><text x="420" y="178" class="w">Python &amp; JavaScript</text></g>
    <g class="a" style="animation-delay:1.8s"><text x="330" y="204" class="g">work</text><text x="420" y="204" class="w">jovem aprendiz @ Appmax</text></g>
    <g class="a" style="animation-delay:2.0s"><text x="330" y="230" class="g">study</text><text x="420" y="230" class="w">Téc. Desenvolvimento de Sistemas · SENAC</text></g>
    <g class="a" style="animation-delay:2.2s"><text x="330" y="256" class="g">base</text><text x="420" y="256" class="w">Brasil · GMT-3</text></g>
    <g class="a" style="animation-delay:2.4s">
      <text x="330" y="282" class="g">status</text>
      <text x="420" y="282" class="g live">●</text>
      <text x="440" y="282" class="w">aberto a oportunidades</text>
    </g>
  </g>

  <!-- paleta -->
  <g class="a" style="animation-delay:2.7s">
    <rect x="330" y="298" width="24" height="12" rx="2" fill="#2bff2b"/>
    <rect x="358" y="298" width="24" height="12" rx="2" fill="#1fe0a0"/>
    <rect x="386" y="298" width="24" height="12" rx="2" fill="#00d9ff"/>
    <rect x="414" y="298" width="24" height="12" rx="2" fill="#3aa0ff"/>
    <rect x="442" y="298" width="24" height="12" rx="2" fill="#7a7cff"/>
    <rect x="470" y="298" width="24" height="12" rx="2" fill="#b36bff"/>
    <rect x="498" y="298" width="24" height="12" rx="2" fill="#d6ffd6"/>
    <rect x="526" y="298" width="24" height="12" rx="2" fill="#5f8f5f"/>
