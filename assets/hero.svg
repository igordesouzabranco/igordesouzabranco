    <text class="asc" x="48.32" y="217.86" xml:space="preserve" textLength="250.80" lengthAdjust="spacing" style="animation-delay:1.25s">           - .--=**:-.+@%-==--------:::::::::::---::::.</text>
    <text class="asc" x="48.32" y="226.98" xml:space="preserve" textLength="250.80" lengthAdjust="spacing" style="animation-delay:1.30s">           +::=++%%=-=@%-------:::--:::::::::::-----::.</text>
    <text class="asc" x="48.32" y="236.10" xml:space="preserve" textLength="255.36" lengthAdjust="spacing" style="animation-delay:1.35s">           *--=-:++==@#:-::-----------:::-:::.  :---::.-</text>
    <text class="asc" x="48.32" y="245.22" xml:space="preserve" textLength="255.36" lengthAdjust="spacing" style="animation-delay:1.40s">            =-==:-=+%#:--...------------::::::. ..:-::.-</text>
    <text class="asc" x="48.32" y="254.34" xml:space="preserve" textLength="255.36" lengthAdjust="spacing" style="animation-delay:1.45s">            <tspan class="r">#</tspan>==<tspan class="r">*=</tspan>*#@  ::::..:------------::::::.. .--:.-</text>
    <text class="asc" x="48.32" y="263.46" xml:space="preserve" textLength="255.36" lengthAdjust="spacing" style="animation-delay:1.50s">             *<tspan class="r">*+</tspan>*##     :::-.:------------:::::. .:--:.-</text>
    <text class="asc" x="48.32" y="272.58" xml:space="preserve" textLength="250.80" lengthAdjust="spacing" style="animation-delay:1.55s">             +<tspan class="r">+</tspan>           ::---=----------------:----:.</text>
