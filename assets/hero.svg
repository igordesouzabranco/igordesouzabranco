    <text class="asc" x="48.32" y="99.30" xml:space="preserve" textLength="72.96" lengthAdjust="spacing" style="animation-delay:0.60s">  ++++****#*+**+</text>
    <text class="asc" x="48.32" y="108.42" xml:space="preserve" textLength="95.76" lengthAdjust="spacing" style="animation-delay:0.65s">+-=::-=-.:++**--:-**+</text>
