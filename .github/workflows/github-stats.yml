name: Atualizar GitHub Stats

on:
  schedule:
    - cron: '0 6 * * *' # todo dia às 03:00 (Brasília)
  workflow_dispatch: # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar SVG
        run: node scripts/generate-stats.mjs
        env:
          # Usa o PAT (GH_STATS_TOKEN) se existir; senão cai no token padrão do Actions
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # EXCLUDE_LANGS: 'HTML,CSS'

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-terminal.svg
          git diff --staged --quiet || (git commit -m "chore: atualiza github stats" && git push)
